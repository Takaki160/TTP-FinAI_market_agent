# -*- coding: utf-8 -*-
"""
Phase 2 Market Color Backtestable Pipeline
-----------------------------------------
- 同一套逻辑：离线回测 & 实时 Agent 共用
- LLM 仅用于「事件结构化」（此处留接口）
- 数值计算 100% 确定性
"""

from datetime import datetime, timedelta
from typing import List, Dict, Literal
from dataclasses import dataclass
import csv
import math

# =====================================================
# 1. Schema 定义（回测最小原子）
# =====================================================

@dataclass
class NewsEvent:
    event_type: str                     # MonetaryPolicy / Earnings / GeoPolitics ...
    level: Literal["Macro", "Sector"]
    direction: int                      # -1 / 0 / 1
    strength: float                     # 0.0 ~ 1.0
    assets: List[str]
    source: str
    timestamp: datetime


# =====================================================
# 2. 数据加载层（回测 / 实时统一接口）
# =====================================================

def load_news_snapshot(as_of: datetime,
                       window_hours: int = 12) -> List[Dict]:
    """
    返回指定时间窗口内的新闻快照
    ⚠️ 回测时应来自历史库 / CSV / DB
    """
    # ---- 示例占位（你替换成真实历史数据）----
    return [
        {
            "source": "CLS",
            "time": as_of - timedelta(hours=2),
            "title": "央行释放偏宽松信号",
            "content": "市场对后续政策预期升温"
        }
    ]


def load_market_snapshot(as_of: datetime,
                         assets: List[str]) -> Dict[str, Dict]:
    """
    返回行情截面（必须是 as_of 时刻已知的数据）
    """
    # ---- 示例占位 ----
    return {
        "000300.SH": {
            "return": 0.6,          # %
            "volume": 1.4e9,
            "volume_ma": 1.1e9
        }
    }


# =====================================================
# 3. 事件抽取层（LLM ONLY：结构化，不算分）
# =====================================================

def extract_events(news: List[Dict],
                   as_of: datetime) -> List[NewsEvent]:
    """
    ⚠️ 回测原则：
    - LLM 只能做事件抽取
    - 不给最终情绪
    - 不给权重
    """
    events: List[NewsEvent] = []

    for n in news:
        # ---- 示例规则化（回测可用）----
        if "央行" in n["title"]:
            events.append(
                NewsEvent(
                    event_type="MonetaryPolicy",
                    level="Macro",
                    direction=1,
                    strength=0.8,
                    assets=["000300.SH"],
                    source=n["source"],
                    timestamp=n["time"]
                )
            )

    return events


# =====================================================
# 4. 因子规则层（完全确定性）
# =====================================================

def score_macro(events: List[NewsEvent]) -> float:
    vals = [
        e.direction * e.strength
        for e in events if e.level == "Macro"
    ]
    return sum(vals) / len(vals) if vals else 0.0


def score_sector(events: List[NewsEvent]) -> float:
    vals = [
        e.direction * e.strength
        for e in events if e.level == "Sector"
    ]
    return sum(vals) / len(vals) if vals else 0.0


def has_source_consensus(events: List[NewsEvent]) -> bool:
    dirs = {e.direction for e in events if e.direction != 0}
    return len(dirs) == 1 and len(events) >= 2


# =====================================================
# 5. MarketColor（确定性计算核心）
# =====================================================

def _clip(v: float, lo: float, hi: float) -> float:
    return max(lo, min(v, hi))


def calculate_sentiment_score(macro_score: float,
                              macro_weight: float,
                              sector_score: float,
                              sector_weight: float) -> Dict:
    macro_score = _clip(macro_score, -1, 1)
    sector_score = _clip(sector_score, -1, 1)

    total_w = macro_weight + sector_weight
    if total_w <= 0:
        raise ValueError("Total weight must be positive")

    w_m = macro_weight / total_w
    w_s = sector_weight / total_w
    score = macro_score * w_m + sector_score * w_s

    if score >= 0.6:
        mood = "Greed"
    elif score >= 0.2:
        mood = "Optimism"
    elif score <= -0.6:
        mood = "Fear"
    elif score <= -0.2:
        mood = "Pessimism"
    else:
        mood = "Neutral"

    return {
        "score": round(score, 4),
        "mood": mood
    }


def calculate_confidence_level(news_dir: int,
                               price_dir: int,
                               is_high_volume: bool,
                               source_consensus: bool) -> Dict:
    conf = 0.5
    trace = []

    if source_consensus:
        conf += 0.2
        trace.append("Consensus(+0.2)")

    if news_dir != 0:
        if news_dir == price_dir:
            conf += 0.2
            trace.append("Price_Match(+0.2)")
        elif price_dir != 0:
            conf -= 0.3
            trace.append("Price_Divergence(-0.3)")

    if is_high_volume:
        conf += 0.1
        trace.append("High_Vol(+0.1)")
    else:
        conf -= 0.1
        trace.append("Low_Vol(-0.1)")

    return {
        "confidence": round(_clip(conf, 0, 1), 2),
        "logic_trace": " | ".join(trace)
    }


# =====================================================
# 6. Phase 2 Pipeline（⭐唯一事实来源）
# =====================================================

def run_phase2(as_of: datetime) -> Dict:
    # ---- Stage 1: Snapshot ----
    news = load_news_snapshot(as_of)
    market = load_market_snapshot(as_of, ["000300.SH"])

    # ---- Stage 2: Events & Factors ----
    events = extract_events(news, as_of)
    macro_score = score_macro(events)
    sector_score = score_sector(events)

    # ---- Stage 3: 情绪计算 ----
    sentiment = calculate_sentiment_score(
        macro_score=macro_score,
        macro_weight=0.5,
        sector_score=sector_score,
        sector_weight=0.3
    )

    idx = market["000300.SH"]
    confidence = calculate_confidence_level(
        news_dir=int(math.copysign(1, macro_score)) if macro_score != 0 else 0,
        price_dir=int(math.copysign(1, idx["return"])) if idx["return"] != 0 else 0,
        is_high_volume=idx["volume"] > idx["volume_ma"],
        source_consensus=has_source_consensus(events)
    )

    return {
        "as_of": as_of.isoformat(),
        "macro_score": round(macro_score, 4),
        "sector_score": round(sector_score, 4),
        "sentiment": sentiment,
        "confidence": confidence
    }


# =====================================================
# 7. 简易回测 Runner（可直接跑）
# =====================================================

def run_backtest(start: datetime,
                 end: datetime,
                 step_minutes: int = 60,
                 output_csv: str = "phase2_results.csv"):
    with open(output_csv, "w", newline="", encoding="utf-8") as f:
        writer = csv.writer(f)
        writer.writerow([
            "as_of",
            "macro_score",
            "sector_score",
            "sentiment",
            "confidence"
        ])

        t = start
        while t <= end:
            res = run_phase2(t)
            writer.writerow([
                res["as_of"],
                res["macro_score"],
                res["sector_score"],
                res["sentiment"]["score"],
                res["confidence"]["confidence"]
            ])
            print(f"✔ {t}")
            t += timedelta(minutes=step_minutes)


# =====================================================
# 8. 本地测试
# =====================================================

if __name__ == "__main__":
    run_backtest(
        start=datetime(2024, 1, 1, 10, 0),
        end=datetime(2024, 1, 5, 15, 0),
        step_minutes=60
    )
